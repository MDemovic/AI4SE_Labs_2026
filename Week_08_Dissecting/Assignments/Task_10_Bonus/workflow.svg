<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
  <title id="title">Coursework AI workflow</title>
  <desc id="desc">Open an assignment, ask Codex to explain and help, review the work, revise if necessary, then commit and push. Codex can optionally delegate a bounded task to a subagent.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#44546b"/></marker></defs>
  <rect width="900" height="580" fill="#f6f8fb"/>
  <g fill="#e4edfb" stroke="#456b9f" stroke-width="2">
    <rect x="270" y="25" width="360" height="55" rx="10"/><rect x="270" y="115" width="360" height="55" rx="10"/>
    <rect x="270" y="205" width="360" height="55" rx="10"/><rect x="270" y="295" width="360" height="55" rx="10"/>
    <rect x="270" y="385" width="360" height="55" rx="10"/><rect x="270" y="490" width="360" height="55" rx="10"/>
    <rect x="665" y="205" width="205" height="55" rx="10"/><rect x="25" y="385" width="190" height="55" rx="10"/>
  </g>
  <g fill="#172b48" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">
    <text x="450" y="58">Open assignment in editor</text><text x="450" y="148">Ask Codex to explain requirements</text>
    <text x="450" y="238">Ask Codex to help with task</text><text x="450" y="328">Review files and test results</text>
    <text x="450" y="418">Changes needed?</text><text x="450" y="523">Add, commit and push</text>
    <text x="767" y="228">Optional: delegate</text><text x="767" y="248">to a subagent</text>
    <text x="120" y="408">Edit or ask Codex</text><text x="120" y="428">to revise</text>
  </g>
  <g fill="none" stroke="#44546b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M450 80 V115 M450 170 V205 M450 260 V295 M450 350 V385 M450 440 V490"/>
    <path d="M270 412 H215 M120 385 V323 H270"/><path d="M630 232 H665" stroke-dasharray="6 4"/>
  </g>
  <g fill="#44546b" font-family="Arial, sans-serif" font-size="14"><text x="235" y="400">Yes</text><text x="460" y="468">No</text></g>
</svg>
